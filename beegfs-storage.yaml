- name: Beegfs Storage Volumes
  hosts: storage
  become: yes
  tasks:

    - name: Install zfs
      apt:
        name:
          - zfsutils-linux 
          - zfs-dkms
          - libzfslinux-dev
        state: present
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "Debian"

    - name: Install OpenZFS repo
      dnf:
        name: "https://zfsonlinux.org/epel/zfs-release-2-2.el{{ ansible_distribution_major_version }}.noarch.rpm"
        disable_gpg_check: true
        state: present
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "RedHat"

    - name: Install zfs dependencies
      dnf:
        name:
          - snapd
          - dkms
          - kernel-devel
        state: present
          #update_cache: yes
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "RedHat"

    - name: Enable snapd
      service:
        name: snapd
        enabled: true
        state: started
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "RedHat"
      register: task_output

    - name: Reboot server and wait for it to come back
      ansible.builtin.reboot:
        msg: "Force reboot"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 1
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "RedHat"
        - task_output.changed

    - name: Install lxd
      community.general.snap:
        name: lxd
        state: present
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "RedHat"

    - name: Install zfs
      dnf:
        name:
          - zfs
        state: present
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "RedHat"

    - name: Configure sysctl values for lxd
      copy:
        src: ./files/90-lxd-override.conf
        dest: /etc/sysctl.d/90-lxd-override.conf
        mode: 'u=rw-,g=r--'
        force: yes
      register: task_output
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "RedHat"

    - name: Reboot server and wait for it to come back
      ansible.builtin.reboot:
        msg: "Force reboot"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 1
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: 
        - item.raid == "ZFS"
        - ansible_os_family == "RedHat"
        - task_output.changed


    - name: Collect disk info
      parted:
        device: "/dev/disk/by-path/pci-0000:{{ item.scsi }}:00.0-scsi-0:{{ item.port }}:{{ item.drive }}:0"
        unit: GiB
        state: info
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: item.raid == "RAID"

    - name: Create a new primary partition for the metadata target
      community.general.parted:
        device: "{{ item.device }}"
        number: "{{ item.partition }}"
        label: gpt
        state: present
        fs_type: xfs
        part_start: "{{ item.start }}"
        part_end: "{{ item.end }}"
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: item.raid == "RAID" and item.partition != 0

    - name: Create an XFS filesystem on the new partition
      community.general.filesystem:
        fstype: xfs
        dev: "{{ item.device }}"
        opts: "-d su=1m,sw=6 -l version=2,su=128k -isize=512"
        state: present
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: item.raid == "RAID"

    - name: Label the XFS filesystem
      #command: xfs_admin -L "{{ hostvars[inventory_hostname].st_prefix }}{{ hostvars[inventory_hostname].st_nodeid }}{{ item.target }}" "/dev/disk/by-path/pci-0000:{{ item.scsi }}:00.0-scsi-0:{{ item.port }}:{{ item.drive }}:0-part1"
      command: xfs_admin -L "{{ hostvars[inventory_hostname].st_prefix }}{{ hostvars[inventory_hostname].st_nodeid }}{{ item.target }}" "{{ item.device }}"
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: item.raid == "RAID"

    - name: Create the mount point for the filesystem
      file:
        path: "{{ hostvars[inventory_hostname].st_path }}/{{ hostvars[inventory_hostname].st_prefix }}{{ hostvars[inventory_hostname].st_nodeid }}{{ item.target }}"
        state: directory
        mode: '0755'
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: item.raid == "RAID"

    - name: Mount the storage target filesystem
      ansible.posix.mount:
        path: "{{ hostvars[inventory_hostname].st_path }}/{{ hostvars[inventory_hostname].st_prefix }}{{ hostvars[inventory_hostname].st_nodeid }}{{ item.target }}"
        src: LABEL={{ hostvars[inventory_hostname].st_prefix }}{{ hostvars[inventory_hostname].st_nodeid }}{{ item.target }}
        fstype: xfs
        opts: "noatime,nodiratime,logbufs=8,logbsize=256k,largeio,inode64,swalloc"
        state: mounted
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: item.raid == "RAID"

    - name: Copy ZFS storage disk script
      copy:
        src: ./scripts/mkzfs
        dest: /tmp/mkzfs
        mode: 'u=rwx,g=rwx'
        force: yes
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: item.raid == "ZFS"

    - name: Prepare the script to create zfs pools
      command:
        argv:
        - "/tmp/mkzfs"
        - "{{ item.wipedisk }}"
        - "{{ item.device }}"
        - "{{ item.partition }}"
        - "{{ hostvars[inventory_hostname].st_pools}}"
        - "{{ hostvars[inventory_hostname].st_disks}}"
        - "{{ hostvars[inventory_hostname].st_path }}"
        - "{{ hostvars[inventory_hostname].st_pool }}"
        - "{{ hostvars[inventory_hostname].st_type}}"
      with_items: "{{ hostvars[inventory_hostname].st_devices }} "
      when: item.raid == "ZFS"

    - name: Run the mkzpool script
      command: "bash /tmp/mkzpool"
      with_items: "{{ hostvars[inventory_hostname].st_devices }} "
      when: item.raid == "ZFS"

    - name: Copy the zpool validation script
      copy:
        src: ./scripts/ckzfs
        dest: /tmp/ckzfs
        mode: 'u=rwx,g=rwx'
        force: yes
      with_items: "{{ hostvars[inventory_hostname].st_devices }}"
      when: item.raid == "ZFS"

    - name: Verify the zpools were created
      command:
        argv:
        - "/tmp/ckzfs"
        - "{{ hostvars[inventory_hostname].st_pools}}"
        - "{{ hostvars[inventory_hostname].st_pool }}"
      with_items: "{{ hostvars[inventory_hostname].st_devices }} "
      when: item.raid == "ZFS"

    - name: Create the directory for the beegfs secret
      file:
        path: /etc/beegfs
        state: directory
        mode: '0750'

    - name: Copy TLS cert
      copy:
        src: files/cert.pem
        dest: /etc/beegfs/cert.pem
        owner: root
        group: root
        mode: '0400'

    - name: Copy TLS key
      copy:
        src: files/key.pem
        dest: /etc/beegfs/key.pem
        owner: root
        group: root
        mode: '0400'

    - name: Copy security configuration
      copy:
        src: files/conn.auth
        dest: /etc/beegfs/conn.auth
        owner: root
        group: root
        mode: '0400'

    - name: Copy .env file
      copy:
        src: ./scripts/.env
        dest: /tmp/.env
        mode: 'u=rw,g=rw'
        force: yes

    - name: Copy mkcompose script
      copy:
        src: ./scripts/mkcompose
        dest: /tmp/mkcompose
        mode: 'u=rwx,g=rwx'
        force: yes

    - name: Run the mkcompose script to create the docker-compose.yaml file
      command:
        argv:
        - "/tmp/mkcompose"
        - "{{ beegfs_version }}"
        - "{{ hostvars[inventory_hostname].st_nodeid }}"
        - "storage"

