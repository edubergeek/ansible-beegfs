    - name: Add beegfs firewall rules for TCP
      ufw:
        rule: allow
        port: 8003:8010
        proto: tcp
        src: '{{ item }}'
      loop:
        - 10.88.0.0/16
        - 10.19.0.0/16
      when: ansible_os_family == "Debian"

    - name: Add beegfs firewall rules for UDP
      ufw:
        rule: allow
        port: 8003:8010
        proto: udp
        src: '{{ item }}'
      loop:
        - 10.88.0.0/16
        - 10.19.0.0/16
      when: ansible_os_family == "Debian"

    - name: Enable ufw
      ufw:
        state: enabled
      when: ansible_os_family == "Debian"

    - name: Add beegfs firewall rules for TCP
      firewalld:
        state: enabled
        permanent: true
        immediate: true
        rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ beegfs_port_begin }}-{{ beegfs_port_end }}" protocol="tcp" accept'
      loop:
        - 10.88.0.0/16
        - 10.15.0.0/16
      when: ansible_os_family == "RedHat"

    - name: Add beegfs firewall rules for UDP
      firewalld:
        state: enabled
        permanent: true
        immediate: true
        rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ beegfs_port_begin }}-{{ beegfs_port_end }}" protocol="udp" accept'
      loop:
        - 10.88.0.0/16
        - 10.15.0.0/16
      when: ansible_os_family == "RedHat"

    - name: Enable firewall
      service:
        name: firewalld
        enabled: true
        state: started
      when: ansible_os_family == "RedHat"
